# Deploy on push to main: backend → Cloud Run, frontend → Firebase Hosting.
# Uses Workload Identity Federation so no service-account JSON keys leave GCP.
#
# One-time setup: see docs/SETUP_FROM_GITHUB.md (Option C).
# Required GitHub secrets:
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT             (deployer SA)
#   GCP_RUNTIME_SERVICE_ACCOUNT     (runtime SA, e.g. procassesment-run@PROJECT.iam.gserviceaccount.com)

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGION:  us-central1
  SERVICE: procassesment
  REPO:    app

jobs:
  backend:
    name: Backend → Cloud Run
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build backend image
        run: |
          gcloud builds submit \
            --tag "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::7}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::7}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --timeout 600 \
            --port 8080 \
            --set-env-vars "GEMINI_VERTEX_PROJECT=${{ secrets.GCP_PROJECT_ID }},GEMINI_VERTEX_LOCATION=${REGION},GEMINI_MODEL=gemini-2.5-pro,FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet
          URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run: ${URL}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend → Firebase Hosting
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live

      - name: Print URL
        run: |
          echo "Hosting: https://${{ secrets.GCP_PROJECT_ID }}.web.app" >> "$GITHUB_STEP_SUMMARY"
