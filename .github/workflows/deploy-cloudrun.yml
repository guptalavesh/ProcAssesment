# Build the app and deploy it to Cloud Run.
# Uses Workload Identity Federation — no service-account JSON keys needed.
#
# One-time GCP setup: see docs/SETUP_FROM_GITHUB.md (Option C).
# Required GitHub secrets:
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT             (deployer SA, e.g. github-actions@PROJECT.iam.gserviceaccount.com)
#   GCP_RUNTIME_SERVICE_ACCOUNT     (runtime SA, e.g. procassesment-run@PROJECT.iam.gserviceaccount.com)

name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGION:  us-central1
  SERVICE: procassesment
  REPO:    app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_REGION=${REGION},_SERVICE=${SERVICE},SHORT_SHA=${GITHUB_SHA::7}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::7}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --timeout 600 \
            --port 8080 \
            --set-env-vars "GEMINI_VERTEX_PROJECT=${{ secrets.GCP_PROJECT_ID }},GEMINI_VERTEX_LOCATION=${REGION},GEMINI_MODEL=gemini-2.5-pro" \
            --allow-unauthenticated \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet

      - name: Print URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "Deployed to: $URL"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
